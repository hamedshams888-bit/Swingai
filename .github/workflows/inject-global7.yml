name: Inject Global 7 Scanner
on:
  push:
    branches: [main]
    paths:
      - global7.js
      - cleanup-old-scanner.js
      - scanner-fix.js
      - .github/workflows/inject-global7.yml
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script tags
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          for tag in ['<script src="global7.js"></script>','<script src="cleanup-old-scanner.js"></script>','<script src="scanner-fix.js"></script>']:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'SwingAI Bot'
          git config user.email 'swingai-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix Global 7 scan button feedback'
          git push
