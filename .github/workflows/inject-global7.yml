name: Inject Global 7 Scanner
on:
  push:
    branches: [main]
    paths:
      - global7.js
      - cleanup-old-scanner.js
      - scanner-fix.js
      - .github/workflows/inject-global7.yml
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script tags with cache busting
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('index.html')
          s=p.read_text()
          v=os.environ.get('GITHUB_SHA','latest')[:12]
          for name in ['global7.js','cleanup-old-scanner.js','global7_patch.js','scanner-fix.js']:
              s=re.sub(r'<script src="'+re.escape(name)+r'(?:\?[^\"]*)?"></script>', '<script src="'+name+'?v='+v+'"></script>', s)
              tag='<script src="'+name+'?v='+v+'"></script>'
              if tag not in s and ('<script src="'+name+'"></script>') not in s:
                  s=s.replace('</body>',tag+'</body>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'SwingAI Bot'
          git config user.email 'swingai-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Bust scanner script cache'
          git push
