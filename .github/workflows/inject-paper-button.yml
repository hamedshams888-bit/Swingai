name: Inject Paper Trading Button
on:
  push:
    branches: [main]
    paths:
      - global7_patch.js
      - .github/workflows/inject-paper-button.yml
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Paper Trading patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="global7_patch.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'SwingAI Bot'
          git config user.email 'swingai-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add Paper Trading button to Global 7'
          git push
